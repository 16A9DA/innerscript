{% extends "base.html" %}
{% block title %}Edit profile · InnerScript{% endblock %}
{% block content %}
<section class="form wrap">
  <h1 class="h-display mb-24">Edit profile</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Email</label>
    <p class="muted-sm mb-20">{{ request.user.email }}</p>
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    {% endfor %}
    <div class="mt-24"><button type="submit" class="btn btn-lg"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Save</button></div>
  </form>
  <p class="sep-top">
    <a href="{% url 'accounts:account_delete' %}" class="muted-sm text-pink">Delete my account</a>
  </p>
</section>
{% endblock %}
